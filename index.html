<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 0; }
    #search-box {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      background: white;
      padding: 8px 12px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      display: flex;
      gap: 8px;
      width: 80%;
    }
    #search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 14px;
    }
    #search-btn {
      background: #4285F4;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    #map { width: 100vw; height: 100vh; }
    #info {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      padding: 10px 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      font-size: 13px;
      display: none;
      max-width: 80%;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="search-box">
    <input id="search-input" type="text" placeholder="Buscar dirección o lugar...">
    <button id="search-btn">Buscar</button>
  </div>
  <div id="map"></div>
  <div id="info" id="info"></div>

  <script>
    let map, marker, geocoder;

    function initMap() {
      geocoder = new google.maps.Geocoder();
      map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 40.4168, lng: -3.7038 },
        zoom: 12,
        mapTypeControl: false,
      });

      map.addListener("click", (e) => {
        placeMarker(e.latLng);
        reverseGeocode(e.latLng);
      });

      document.getElementById("search-btn").addEventListener("click", buscar);
      document.getElementById("search-input").addEventListener("keypress", (e) => {
        if (e.key === "Enter") buscar();
      });
    }

    function buscar() {
      const query = document.getElementById("search-input").value;
      if (!query) return;
      geocoder.geocode({ address: query }, (results, status) => {
        if (status === "OK") {
          const loc = results[0].geometry.location;
          map.setCenter(loc);
          map.setZoom(15);
          placeMarker(loc);
          mostrarInfo(results[0].formatted_address, loc.lat(), loc.lng());
        } else {
          alert("No se encontró la dirección.");
        }
      });
    }

    function placeMarker(location) {
      if (marker) marker.setMap(null);
      marker = new google.maps.Marker({ position: location, map });
    }

    function reverseGeocode(latLng) {
      geocoder.geocode({ location: latLng }, (results, status) => {
        if (status === "OK" && results[0]) {
          mostrarInfo(results[0].formatted_address, latLng.lat(), latLng.lng());
        }
      });
    }

    function mostrarInfo(address, lat, lng) {
      const info = document.getElementById("info");
      info.style.display = "block";
      info.innerHTML = `📍 <b>${address}</b><br>Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}`;
      // Enviar datos a Power Apps
      if (window.parent) {
        window.parent.postMessage(
          JSON.stringify({ address, lat, lng }), "*"
        );
      }
    }
  </script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDLuSo4UGIxh6ttpuZhA3y4okgS7mdhS94&callback=initMap" async defer></script>
</body>
</html>
